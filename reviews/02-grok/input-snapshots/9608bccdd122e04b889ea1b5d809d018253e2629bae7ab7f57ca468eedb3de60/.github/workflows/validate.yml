name: Repository integrity

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out the exact revision
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify repository and derived content
        run: python3 tools/lucifer.py check
      - name: Test review gate behavior with temporary fixtures
        run: python3 -m unittest discover -s tests -v

# This workflow does not call a model, install the persona, write repository
# contents, or use third-party secrets. An honest pending-review state passes
# integrity checks while remaining ineligible for installation.
